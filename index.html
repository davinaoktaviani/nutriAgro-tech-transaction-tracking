place(){const v=vals();if(!valid(v)){upd();toast("Please fix the highlighted fields — spec must be within SLA");return}const d=new Date(),y=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"),r=n=>Math.round(n*10)/10,o={id:`NA-${y}-0${DB.o.length+10}`,c:U.client,p:"okara",q:Math.round(v.q),s:[r(v.p),r(v.f),r(v.m)],st:1,pay:0,t:[now()]};DB.o.unshift(o);ev("production",o.c,`New order ${o.id} from ${o.c} — ${sps(o)}`);sel=o.id;pg="orders";save();A.close();toast("Order placed — pay the invoice to start production");render()}};
